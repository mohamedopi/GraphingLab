plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// رقم البناء على GitHub يصبح versionCode تلقائيًا حتى يقبل الهاتف كل نسخة جديدة كتحديث
def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace = 'com.graphinglab.app'
    compileSdk = 35

    defaultConfig {
        applicationId = 'com.graphinglab.app'
        minSdk = 23
        targetSdk = 35
        versionCode = runNumber
        versionName = "1.0.${runNumber}"
    }

    // مفتاح توقيع ثابت: بدونه ينشئ GitHub مفتاحًا مختلفًا في كل بناء
    // ويرفض الهاتف تثبيت النسخة الجديدة فوق القديمة.
    signingConfigs {
        stable {
            storeFile = file('debug.keystore')
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.stable
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        abortOnError = false
    }
}
